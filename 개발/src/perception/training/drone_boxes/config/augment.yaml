# 조명 강건성용 오프라인 변형 (augment.py). 학습(train) 그림만 늘린다 — 검증(val) 그림은 그대로 둔다.
# 값이 [a, b] 면 장마다 그 사이에서 고르고, p 는 그 변형을 걸 확률. 연산 설명은 photometric.py 맨 위.
# 기하(위치 · 크기 · 회전)는 건드리지 않는다 → 라벨을 그대로 쓴다. 뒤집기 · 작은 회전 · 이동은 학습 중에 train.yaml 이 한다.

copies: 6          # 원본 1장마다 만들 변형 수 (원본도 그대로 남는다 → 학습 그림 = 원본 × (1 + copies)). 라벨이 수십 장이라 많이
seed: 0
out_suffix: _aug_cut    # 변형 데이터셋 폴더 = <데이터셋><out_suffix> (train.py 는 있으면 다시 쓴다 → 설정을 바꾸면 이름도 바꾼다)
drop_invisible: 0.05   # 라벨 안에서 그림이 찍힌(시야 밖 검정이 아닌) 픽셀이 이 비율보다 적으면 학습 · 검증에서 뺀다 (0 이면 끔)

ops:
  # 조명 모양 (경기장 천장 조명 · 사람 그림자 · 박스 윗면 반사)
  gradient_light: {p: 0.45, strength: [0.15, 0.6]}
  spotlight:      {p: 0.35, strength: [-0.4, 0.6], radius: [0.15, 0.5]}
  shadow:         {p: 0.30, strength: [0.2, 0.55]}
  glare:          {p: 0.20, strength: [0.3, 0.9], count: [1, 3], radius: [0.02, 0.08]}
  # 노출 · 색 (카메라 자동 노출 · 조명 색)
  exposure:       {p: 0.80, range: [0.35, 1.8]}   # 본선 경기장 조명은 연습장과 다를 수 있다 → 넓게
  brightness:     {p: 0.40, range: [-40, 40]}
  contrast:       {p: 0.50, range: [0.6, 1.4]}
  gamma:          {p: 0.40, range: [0.6, 1.6]}
  white_balance:  {p: 0.50, range: [0.82, 1.18]}
  hsv:            {p: 0.50, hue: 6, sat: 0.35, val: 0.2}
  # 연막 (중앙 측면 포그머신)
  fog:            {p: 0.25, strength: [0.1, 0.45], gray: [180, 235]}
  # 화질 (드론 화면은 JPEG · 원근 펴기로 흐려진다)
  blur:           {p: 0.25, ksize: [3, 5]}
  noise:          {p: 0.35, sigma: [2, 9]}
  jpeg:           {p: 0.40, quality: [35, 90]}

# 시야 끝 자르기 (edge_cut.py) — 카메라 시야 끝(map 그림의 검정)이 상자를 가로지르는 화면. 위 조명 변형 전에 건다.
# 2026-11-19 본선 항공뷰(0162.jpg)에서 위쪽 끝에 윗면이 잘린 상자 3개를 v1 이 놓침 → 잘려도 상자 전체 라벨로 가르친다
edge_cut:
  p: 0.5                   # 변형 1장마다 걸 확률
  sides: {top: 0.35, bottom: 0.35, left: 0.15, right: 0.15}
  visible: [0.2, 0.85]     # 겨냥한 상자에 남길 비율
  keep_min: 0.2            # 이보다 적게 남은 라벨은 빼고 그 자리를 검게 칠한다
  tilt: 0.08               # 시야 끝 기울기 (±)
  bend: 60                 # 휨 (그림 끝에서 ± px)
  max_depth: 0.3           # 그림 가장자리에서 이 비율 안쪽 상자만 겨냥 (전체를 검게 덮지 않게)
  second: 0.2              # 반대가 아닌 다른 쪽 끝도 하나 더 자를 확률
