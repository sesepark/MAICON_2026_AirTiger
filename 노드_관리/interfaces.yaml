topics:
  - id: "perception-field-map"
    name: "/team/perception/field_map"
    type: "team_interfaces/msg/FieldMap"
    description: "perception에서 SLAM으로 전달하는 경기장 지도"
    status: "구현 중"
    scope: "team"
    definition_files: ["개발/src/team_interfaces/msg/FieldMap.msg", "개발/src/team_interfaces/msg/FieldRegion.msg", "개발/src/team_interfaces/msg/FieldFace.msg", "개발/src/team_interfaces/msg/FieldVehicle.msg"]
    field_semantics: ["박스 인덱스는 해당 메시지의 boxes 기준.", "면별 이미지 참조는 빈 문자열이면 미확인.", "차량 구분은 SELF, OTHER, UNKNOWN."]
    notes: ["perception 이 발행한다(2026-11-18, map_maker.py): 좌표는 드론 사진에서 잰 그대로(벽에서 벽까지 약 6.12 x 5.00 m), frame_id arena, bases 의 name 은 자리 이름(B-1~R-3), vehicles 는 비어 있다. 한 경기에 지도 하나(첫 통과 결과)이고 같은 내용을 1초마다 다시 보낸다 — header.stamp 는 그 드론 사진을 받은 시각으로 그대로다. SLAM은 최신 수신 메시지를 보관한다.", "SLAM 출발 칸 초기화는 bases 중 name 이 이번 경기 slot(B-1~B-3·R-1~R-3, /team/server/state)인 칸 하나와 boxes·width·height 를 쓴다. 우리 차 표시(SELF·UNKNOWN)는 없어도 된다. 우리 차를 UNKNOWN 으로 넣었으면 SLAM 이 0.35 m 안의 것을 SELF 로 바꿔 내보낸다(2026-11-18).", "거점 종류의 배치(2026-11-19 주최측 공지: 작전지휘소·정비소·군수보급소가 놓이는 줄은 바뀔 수 있다, perception/base_panels.py): bases 의 앞 여섯 개는 자리 이름(B-1~R-3) 그대로이고, 드론 사진의 거점 벽 그림으로 줄마다 종류를 알아낸 진영은 그 뒤에 보고값 이름(예 RED_MAINTENANCE) 세 개를 더 붙인다 — 네모와 row 는 그 종류의 그림이 있는 줄의 것. 알아내지 못한 진영은 붙이지 않는다(여섯·아홉·열두 개). SLAM 은 name 이 slot 인 칸만 보므로 영향이 없고 bases 를 그대로 /team/navigation/map 으로 넘긴다. supervisor(arena.field_map_from_msg)는 자리 이름을 기본 배치(위부터 작전지휘소·정비소·군수보급소)로 먼저 읽고 뒤에 온 보고값 이름으로 덮어쓴다."]
    source_files: ["개발/src/perception/perception/map_maker.py", "개발/src/navigation/navigation/slam_node.py"]
    units: "m"
    frame: "header.frame_id. x는 BLUE → RED, y는 아래 → 위."
    stamp_field: "header.stamp"
    clock: "ROS time"
    special_values: []
  - id: "navigation-map"
    name: "/team/navigation/map"
    type: "team_interfaces/msg/FieldMap"
    description: "주행 노드에 전달하는 경기장 지도"
    status: "구현 중"
    scope: "team"
    definition_files: ["개발/src/team_interfaces/msg/FieldMap.msg", "개발/src/team_interfaces/msg/FieldRegion.msg", "개발/src/team_interfaces/msg/FieldFace.msg", "개발/src/team_interfaces/msg/FieldVehicle.msg"]
    field_semantics: ["박스 인덱스는 해당 메시지의 boxes 기준.", "면별 이미지 참조는 빈 문자열이면 미확인.", "차량 구분은 SELF, OTHER, UNKNOWN."]
    notes: ["boxes·faces 는 드론 지도에서 라이다로 없다고 본 상자를 뺀 것이다(map_fusion, 2026-11-18·2026-11-19): 뺀 상자는 boxes·faces 에서 빠지고 남은 상자의 faces[].box 는 새 번호를 쓴다. 그래서 경기 중에 상자 수·번호가 줄어들 수 있다(되살리면 다시 늘어난다). 라이다로 새로 찾은 상자는 넣지 않는다(2026-11-19) — SLAM 정합에만 쓴다. 이 지도의 상자는 주행 노드가 안 움직이는 벽으로 다루므로, 라이다로만 본 것(서 있는 다른 UGV 일 수 있다)은 주행 노드가 /scan 으로 직접 보고 지도에 없는 물체로 다룬다. map_fusion:=false 면 드론 지도 그대로.", "유효한 SELF 자세가 있으면 관측 후 최대 2초간 자세를 전파한다. 이 경우 header.stamp는 자세 기준 시각이며 나머지 지도 요소는 원본 항공 관측을 유지한다. 라이다 정합에 성공하면 해당 시각부터 최대 2초간 전파한다.", "전파: /odom x·y 이동량을 odom 축→경기장 축 각도(위치 관측과 /odom 쌍으로 맞춤)만큼 돌려 더하고, 방향 변화는 /odom/odom_raw 바퀴 거리 차이((Δ오른쪽−Δ왼쪽)/0.175, 파라미터 yaw_source=wheel 기본, imu면 /imu/data yaw). 각도를 아직 모르면 5 cm 넘게 전파하지 않는다(2026-11-18).", "주행 노드는 frame_id가 arena가 아니면 지도를 쓰지 않는다.", "QoS reliable + transient_local depth 1 (2026-11-18): 늦게 뜨거나 다시 뜬 주행 노드도 마지막 지도를 바로 받는다. 발행·구독 양쪽이 같아야 연결된다.", "박스·크기가 같고 차량만 바뀐 지도는 격자를 다시 만들지 않는다."]
    source_files: ["개발/src/navigation/navigation/slam_node.py", "개발/src/navigation/navigation/map_fusion.py", "개발/src/navigation/navigation/driving_node.py"]
    units: "m"
    frame: "header.frame_id. x는 BLUE → RED, y는 아래 → 위."
    stamp_field: "header.stamp"
    clock: "ROS time"
    special_values: []
