    label: "M6: 상대 셋을 가를 것이 없을 때의 순서를 호출부호 3 · 2 · 1 로 (팀장 결정)"
    before: "위험도가 같으면 호출부호 1 · 2 · 3 순. server_bridge 도 빠진 상대를 1 · 2 · 3 순으로 채웠다. 모의 경기 6판 · 연습 11판에서 나간 M6 는 모두 X-1, X-2, X-3 이었다 (상대의 목숨 · 탄을 읽은 적이 없다)."
    after: "보고 형식은 그대로 (ranking 에 상대 호출부호 셋). supervisor Mission.ranking: 위험도가 같으면 호출부호가 큰 것부터. server_bridge m6_body: 빠진 상대를 번호가 큰 것부터 채운다. 읽은 값(목숨 · 탄)이 있으면 전처럼 그것이 먼저다."
    reason: "2026-11-20 05:40 팀장: 어차피 운인 것 같으니 3, 2, 1 로 바꿔 달라."
    node_ids: ["supervisor", "server_bridge"]
    topic_ids: []
    service_ids: ["report"]
    action_ids: []
  - id: "robot-defaults-m6-hunt-off-20261120"
    date: "2026-11-20T06:00:00+09:00"
    category: "임무 노드 구현"
    label: "로봇에서 도는 기본값: M6 사냥 끔 · locate_sensors 는 전의 두 모델 그대로 (팀장이 정하기 전까지, 통합 쪽)"
    before: "05:25 ~ 05:50 사이 사격 담당의 fire-control 이 main 에 올라와, MissionParams 의 기본값(m6_hunt · m6_instead_of_m5 켬)대로면 정찰이 3분 안에 끝난 판에서는 M5(거점 앞 대기 · 거점 진입)를 하지 않고, locate_sensors 는 UGV 부품 모델 하나로만 답한다 (지정표적 조준에도 쓰인다)."
    after: "supervisor 노드가 읽는 기본값(node.py DEFAULTS)에 mission.m6_hunt = false 를 둔다 — 정찰이 끝난 자리에 서서 3초마다 read_ugvs 만 부르고 M5 를 전처럼 한다. MissionParams 자체의 기본값과 사격 담당의 시험은 그대로다. perception 의 locate_with_ugv_model_only 기본값 true → false (그림 모델 + 부품 모델). 켜는 법: 로봇의 supervisor.json 에 mission.m6_hunt true · programs.json 의 perception 줄에 --ros-args -p locate_with_ugv_model_only:=true."
    reason: "M6 사냥과 부품 모델 하나로 하는 지정표적 조준은 실차로 한 판도 돌지 않았다 (임시_테스트_파일/m6_평가/README.md 3.3). 연습 판의 정찰은 138 ~ 204초에 끝나 거의 모든 판에서 M5 를 건너뛰게 된다. 팀장의 M6 결정은 보류였다 (03:20). 켜고 끄는 것은 팀장 결정에 따른다."
    node_ids: ["supervisor", "perception"]
    topic_ids: []
    service_ids: ["locate-sensors", "read-ugvs"]
    action_ids: []
  - id: "supervisor-assault-guard-beside-robot-20261120"
    date: "2026-11-20T06:00:00+09:00"
    category: "임무 노드 구현"
    label: "supervisor 거점 진입: 거점 안에 다른 로봇이 서 있으면 자리 앞에 먼 쪽으로 기울여 선 뒤에 돌진한다"
    before: "거점 사이를 옮겨 갈 때 · 다른 자리로 다시 들어갈 때는 거점의 세로 범위에 들어서자마자(또는 서 있던 자리에서 바로) 돌진을 냈다 — 차체가 벽과 나란히 그 로봇 쪽을 본 채였다."
    after: "액션 · 타입은 그대로. 들어갈 거점 안(가운데가 벽에서 0.50 m 안)에 서 있는 로봇이 있으면, 먼저 그 자리의 앞(벽에서 0.80 m)에 보통 주행으로 가서 벽 쪽에서 그 로봇의 먼 쪽으로 20° 기울여 서고(허용 10°), 세로로 0.12 m 안 · 그 로봇 쪽으로 2° 까지 기울었을 때 돌진한다. navigation 이 도착을 알렸거나 너무 오래 걸리면 그대로 돌진한다. 한 자리에 돌진을 냈으면 결과가 올 때까지 되돌리지 않는다. 서 있는 로봇이 없는 거점은 전과 같다. mission.assault_guard false = 끔."
    reason: "가상 주행(Mission 을 그대로 돌리고 주행은 navigation 실행기, 고정 기둥이 있는 지도, 그 로봇의 자리 30가지 × 두 방향 60판): 통로를 따라 옮겨 올 때 첫 돌진에 들어간 판 32 → 60, 가장 늦은 판 10.4초 → 4.5초. 가운데 대기 자리에서 게시된 끝 거점으로: 31 → 60, 21.3초 → 6.9초. 전의 첫 돌진이 들어가던 판에서는 0.2 ~ 1.4초 늦다. 실차 02:39 판 22번(60° 기운 채 받은 돌진이 두 번 막힘)이 이 장면. 실차로는 아직 돌지 않았다."
    node_ids: ["supervisor"]
    topic_ids: []
    service_ids: []
    action_ids: ["navigate"]
