    name: "/team/navigation/lidar_boxes"
    type: "geometry_msgs/msg/PoseArray"
    description: "라이다로 찾았지만 드론 지도에는 없는 상자의 가운데 (정찰 대상에 넣으라고 supervisor 에 알림)"
    status: "구현 중"
