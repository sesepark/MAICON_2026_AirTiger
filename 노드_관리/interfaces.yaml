official_references:
  - id: "ros-state"
    equipment: "ugv-system"
    name: "/mil/state"
    label: "로봇 상태"
    kind: "Topic"
    group: "상태·경기"
    type: "mil_msgs/msg/MissionState"
    rate: "2 Hz"
    qos: "depth=1 · TRANSIENT_LOCAL; 나머지 정책은 미명시"
    status: "문서 명시"
    summary: "HP·배터리·모드·경기 단계 확인"
    fields: ["hp / hp_max: 현재·최대 체력", "battery_pct: 배터리 잔량 (%)", "mode: practice / mission", "cmd: 경기 단계", "control: 수신 필드가 아닌 코드에서 계산하는 값"]
    notes: ["공식 제어 가능 계산 예: mode == practice 또는 cmd가 start/resume", "피격 잠금·재장전 등 장치별 제한은 별도 적용", "전체 .msg 필드의 자료형·정의 파일은 OT 확인"]
    sources: ["p2|11~12쪽", "video|상태와 제어 가능 여부"]
    use: "구독"
  - id: "ros-match"
    equipment: "ugv-system"
    name: "/mil/match"
    label: "경기 상태 변경"
    kind: "Topic"
    group: "상태·경기"
    type: "mil_msgs/msg/MatchCommand"
    rate: "상태 변경 시"
    qos: "상태·경기 안내: depth=1 · TRANSIENT_LOCAL; 전체 정책은 OT 대조"
    status: "문서 명시"
    summary: "시작·일시정지·재개·보고·종료 신호"
    fields: ["mode: practice / mission", "cmd: idle / standby / start / pause / resume / report / stop"]
    notes: ["경기 모드는 참가팀이 직접 변경할 수 없음", "pause는 경기 종료가 아님", "resume 후 주행·팬틸트 명령 재전송", "report 단계에도 팀 프로그램 유지; stop 수신 시 종료", "전체 .msg 정의와 추가 필드·자료형은 미공개"]
    sources: ["p2|11~12·18쪽", "video|API 목록"]
    use: "구독"
  - id: "ros-oled"
    equipment: "oled-display"
    name: "/mil/oled"
    label: "OLED 표시"
    kind: "Topic"
    group: "표시"
    type: "OledLine · 패키지 경로 미명시"
    rate: "전송 간격 ≥ 0.5초"
    qos: "공식 예제 depth=10; 나머지 정책 미명시"
    status: "일부 미명시"
    summary: "팀 상태·탐색 단계 등 4줄 문자 표시"
    fields: ["line: 0~3", "text: 한 줄 최대 21자 (영문·숫자·기호)"]
    notes: ["마지막 출력 10초 후 기본 화면으로 복귀", "전체 타입 경로를 mil_msgs/msg/OledLine으로 추정해 확정하지 않음"]
    sources: ["p2|13쪽", "video|API 목록"]
    use: "발행"
  - id: "ros-cmdvel"
    equipment: "drive-unit"
    name: "/cmd_vel"
    label: "주행 명령"
    kind: "Topic"
    group: "주행"
    type: "geometry_msgs/msg/Twist"
    rate: "약 10 Hz 반복"
    qos: "정책 미명시"
    status: "문서 명시"
    summary: "전후진 속도와 회전 속도 명령"
    fields: ["linear.x: -0.6~0.6 m/s; 양수 전진", "angular.z: -3~3 rad/s; 양수 좌회전"]
    notes: ["여러 노드가 동시에 발행하는 것을 공식 자료에서 금지", "명령이 0.5초 끊기면 자동 정지", "정지 명령은 Twist() (속도 0)", "종료·예외 시 정지; resume 후 명령 재전송", "실제 주행 전 충전 케이블 분리·저속 시험 안내"]
    sources: ["p2|15·18쪽", "video|주행과 위치"]
    use: "발행"
  - id: "ros-odom"
    equipment: "drive-unit"
    name: "/odom"
    label: "위치·이동량"
    kind: "Topic"
    group: "센서"
    type: "nav_msgs/msg/Odometry"
    rate: "20 Hz"
    qos: "qos_profile_sensor_data"
    status: "문서 명시"
    summary: "출발점 기준 위치와 방향 확인"
    fields: ["position.x / position.y: 출발점 기준 전후·좌우 위치 (m)", "orientation: x/y/z/w 쿼터니언; yaw 변환"]
    notes: ["frame_id·child_frame_id·TF 트리 구성은 자료에 미명시"]
    sources: ["p2|15쪽", "video|API 목록·IMU"]
    use: "구독"
  - id: "ros-image"
    equipment: "pan-camera"
    name: "/image_raw"
    label: "팬틸트 RGB 영상"
    kind: "Topic"
    group: "센서"
    type: "sensor_msgs/msg/Image"
    rate: "최대 30 FPS · 처리 10 FPS 이하 권장"
    qos: "qos_profile_sensor_data"
    status: "문서 명시"
    summary: "640×480 BGR 영상; Depth 카메라 영상과 별개"
    fields: ["640×480; BGR / bgr8", "변환 예: CvBridge().imgmsg_to_cv2(msg, 'bgr8')", "NumPy 예시 shape: (480, 640, 3)"]
    notes: ["팬틸트 카메라 영상이며 Depth 카메라는 이 토픽이 아님", "CPU 부담으로 10 FPS 이하 권장; AI 추론은 별도 스레드", "교육영상 예제는 단일 프레임 출력이며 스트리밍 예제 아님"]
    sources: ["p2|17~18쪽", "video|카메라"]
    use: "구독"
  - id: "ros-imu"
    equipment: "imu-sensor"
    name: "/imu/data"
    label: "자세·관성 정보"
    kind: "Topic"
    group: "센서"
    type: "sensor_msgs/msg/Imu"
    rate: "20 Hz"
    qos: "qos_profile_sensor_data (교육영상 예제)"
    status: "문서 명시"
    summary: "자세 쿼터니언·각속도·가속도"
    fields: ["orientation: 쿼터니언 → roll / pitch / yaw", "angular_velocity: 각속도", "linear_acceleration: m/s²; 크기를 9.80665로 나누면 g"]
    notes: ["Roll/Pitch: 기울기, Yaw: 진행 방향", "기울기·충격 감지 시 주행 정지 예제 안내"]
    sources: ["p2|10·17쪽", "video|IMU"]
    use: "구독"
  - id: "ros-gimbal"
    equipment: "pan-tilt"
    name: "/mil/gimbal"
    label: "팬틸트 제어"
    kind: "Service"
    group: "장치 제어"
    type: "mil_msgs/srv/Gimbal"
    rate: "요청 시"
    qos: "서비스 QoS 정책 미명시"
    status: "문서 명시"
    summary: "팬틸트 절대 위치 요청과 접수 결과"
    request: ["pan: -100~100; 양수 오른쪽; 1단위 0.5°", "tilt: -100~100; 양수 위쪽; 1단위 0.15°", "speed: 1~270 °/s", "acc: 1~254; 권장 20"]
    response: ["ok: 명령 접수", "locked: 제어 잠금", "No response: 응답 실패 또는 시간 초과; 정상 응답 코드와 구분"]
    notes: ["pan/tilt 요청값은 각도가 아닌 위치값", "ok는 목표 위치 도착을 뜻하지 않음", "call_async 예제; 응답 대기 timeout_sec=3.0은 예제값", "응답의 전체 필드명·자료형은 .srv 원본 확인 필요"]
    sources: ["p2|14쪽", "video|팬틸트"]
    use: "서비스 호출"
  - id: "ros-fire"
    equipment: "laser-device"
    name: "/mil/fire"
    label: "레이저 모의타격"
    kind: "Service"
    group: "장치 제어"
    type: "mil_msgs/srv/Fire"
    rate: "발사 시작 간격 ≥ 10초"
    qos: "서비스 QoS 정책 미명시"
    status: "문서 명시"
    summary: "대회용 레이저 1회 요청과 장치 상태 응답"
    request: ["Fire.Request(): 요청 파라미터 없음"]
    response: ["success: 요청 성공 여부", "message: fired / empty / locked / reloading", "left_ms: 다음 발사까지 남은 ms"]
    notes: ["1회 5초 발광; 발사 시작 10초 후 재발사 가능", "fired는 장치 발사 응답이며 표적의 유효타격 판정과 별개", "피격 후 조준·발사 10초 제한; 대기·일시정지·보고·종료 시 잠금", "PDF 2차 안내: HP 0이어도 탄약과 다른 제한 조건에 따라 발사 가능; 최종 규정 대조", "공식 안내: 사람 눈 방향 발사 금지"]
    sources: ["p2|16쪽", "video|레이저"]
    use: "서비스 호출"
