    field_semantics: ["pose.position.x·y = 경기장 좌표(m). pose.orientation = 차체 방향(yaw).", "header.stamp = 그 위치가 맞는 시각(발행 시각 아님). 주행 노드는 이 시각 뒤의 움직임을 /odom·/imu/data로 더한다."]
