    field_semantics: ["report.kind가 선택한 command/sectors/assessment만 사용하고 나머지는 비운다.", "M3 sectors는 현재까지의 전체 제출 스냅숏. 증분 추가가 아니다.", "report_id/revision: 동일 보고와 수정 보고를 구분하는 로컬 식별자. 서버의 중복제거 보장은 아님.", "M1/M6 코드값·M3 type/sector·개수·M6 상대 호출부호를 서버 전송 전 검증한다."]
    notes: ["M2·M4·M5 유효타격/진입 판정 보고를 만들어 보내지 않는다.", "응답이 오기 전 단계가 바뀔 수 있다. 재시도 전 단계·마감·현재 revision을 재확인한다."]
