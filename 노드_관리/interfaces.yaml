# ROS 2 개발 계약 (version 4)
# 자료형 구조 원본: 개발/src/team_interfaces/{msg,srv,action}. YAML은 의미·연결·정책을 관리.
# 팀 노드는 모두 설계 확정·미구현. 패키지/타입 파일 존재는 실행 노드 구현 완료를 뜻하지 않음.
# status "대회 제공" = 로봇이 기본으로 실행하는 대회 측 노드(실측). 팀이 수정할 수 없음. 그 패키지는 kind "official", path null, robot_path = 로봇 안 경로.
# 주기·타임아웃·QoS의 팀 값은 초기 설계 계약이며 실측값이 아님. 외부 미공개 값은 null.
# 값 null/빈 목록은 미확인 또는 미기록. 무제한/비적용은 notes·정책 설명에 명시.
# 지원 YAML: 최상위 값 + 평평한 레코드 목록. 문자열 큰따옴표, 배열 한 줄 JSON, 숫자/null.
# 연결은 *_endpoints에만 기록. role: topic publisher/subscriber, service/action provider/client.
# 공통 타입 필드 구조를 YAML에 복제하지 않음. field_semantics에는 필드 경로·의미·제약만 작성.
# receive_timeout_ms는 마지막 수신 이후, max_data_age_ms는 원본 생성 시각 이후로 구분.
# source_files는 실제 실행 구현 파일만. 패키지 뼈대는 packages.path, 타입 원본은 definition_files.
# 새 노드/패키지/인터페이스는 목록에 추가. HTML은 이름·개수와 무관하게 계산.
# actions: goal_semantics/feedback_semantics/result_semantics/cancel_policy/preemption_policy.
# 액션 QoS를 하나로 뭉치지 않음. feedback/status/topic, goal/result/cancel 서비스별 변경은
# action_endpoints의 qos_notes에 명시. 현재는 ROS 2 action 기본 정책을 사용하도록 계획.
# changes는 ROS 계약·구현의 변경만 기록. 웹페이지·스키마 수정 기록 제외.
