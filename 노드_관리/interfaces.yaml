    status: "구현 중"
    description: "객체 인식·관측 정보 정리·지정 대상 추적·짐벌 제어를 담당한다."
    notes: ["2026-11-18 팀장 결정: /mil/gimbal 은 supervisor 가 직접 부르고, 이 노드는 TrackTarget 실행 중에만 부른다. /mil/fire와 /cmd_vel은 사용하지 않는다.", "짐벌 명령 접수와 조준 완료를 구분하고, 정렬 여부는 원본 관측 시각·대상 식별 정보와 함께 전달한다.", "카메라·상공 영상의 출처와 촬영 시각을 보존한다. 미확인 식별·좌표·개수를 확정값으로 채우지 않는다.", "구현 범위(2026-11-18): classify_image · read_ugvs(위치만, 상태 값은 못 읽음) 서비스 제공 · node_status 발행 · mission state 구독(run_id). observations · track_target · 짐벌 · 그 밖의 구독은 미구현. 2026-11-18 21시 추가: 드론 사진(/team/server/uav_image)을 받아 지도(/team/perception/field_map)를 발행한다 — 연결은 map_maker.py(supervisor 쪽에서 붙임), 계산은 따로 띄운 프로세스에서 한다. 컨테이너에서만 확인했고 로봇에서 걸리는 시간은 재지 않았다.", "그림 탐지 모델(10종: 객체 6 · 지정표적 3 · non_object) 가중치는 저장소에 없다. model_path 매개변수(기본 /home/ws/team/models/pictures.engine)로 읽으며, 없거나 torch · ultralytics 가 없으면 node_status 가 ERROR 다. 실제 모델로 한 추론은 미검증."]
    source_files: ["개발/src/perception/perception/node.py", "개발/src/perception/perception/pictures.py", "개발/src/perception/perception/detector.py", "개발/src/perception/perception/zoom.py"]
  - id: "server_bridge"
    name: "/server_bridge"
    label: "경기 서버 통신"
    package: "server_bridge"
    owner: "담당자 미지정"
    status: "구현 중"
    description: "준비완료·명령·상공 영상·보고의 HTTP 통신과 ROS 변환을 담당한다."
    notes: ["미션 판단·목표 선택·물리 제어는 supervisor 등 담당 노드에 맡긴다.", "응답은 접수 대기가 아닌 실제 서버 결과로 반환한다. 타임아웃은 성공 여부 미상으로 구분한다.", "명령 대기·영상 수신·보고가 서로의 마감을 막지 않도록 한다. 재시도·중복 처리·전체 보고 교체 의미는 YAML을 따른다.", "2026-11-18 팀장 결정: supervisor 쪽에서 구현. 실행 파일 server_bridge_node. 경기 서버 흉내(임시_테스트_파일/supervisor_가짜상대/fake_world.py --http)와만 돌려 봄 — 실제 경기 서버로는 미검증.", "서버 주소·임무코드는 로봇의 ~/team/secrets.json(저장소에 없음)에서 읽고 기록에 찍지 않는다.", "계약과 다른 점: 보고 응답을 2초에 끊지 않고 서버의 실제 답을 기다린다(창구 시한, 최대 12초). 요청 run_id가 달라도 보낸다(기록에만 남김).", "서버와 주고받은 것은 기록 폴더의 server_bridge/http.jsonl, 드론 사진은 10초에 한 장 drone/에 남긴다.", "포트(2026-11-18 포털에서 확인): 본 경기 8000, 팀 테스트는 같은 주소의 시험 포트 8100(경로·형식 동일). port_mode=auto 면 두 포트의 /me 를 보고 우리 팀의 경기가 열린 쪽을 고른다. /api/rehearsal/ 은 서버에서 없어져 뺐다."]
    source_files: ["개발/src/server_bridge/server_bridge/node.py", "개발/src/server_bridge/server_bridge/client.py", "개발/src/server_bridge/server_bridge/reports.py", "개발/src/server_bridge/server_bridge/constants.py"]
  - id: "llm_worker"
    name: "/llm_worker"
    label: "M1·M6 텍스트 분석"
    package: "llm_worker"
    owner: "담당자 미지정"
    status: "구현 중"
    description: "M1 전술명령 해석과 M6 관측 정보 기반 위험도 분석을 담당한다."
    notes: ["대회 제공 텍스트 LLM API만 사용한다. 영상은 perception의 구조화된 관측으로 전달받는다.", "LLM 출력은 정해진 필드·코드값으로 검증하고, 물리 제어·서버 보고는 직접 수행하지 않는다.", "취소·마감·run_id가 지난 결과는 폐기한다. HTTP 요청 취소가 외부 연산 취소를 보장하지 않음을 구분한다.", "2026-11-18 팀장 결정: supervisor 쪽에서 구현. 실행 파일 llm_worker_node. PARSE_ORDER(M1)만 한다 — ASSESS_THREAT(M6)는 UNSUPPORTED로 답하고 순위는 supervisor가 직접 낸다.", "낱말 규칙으로 먼저 풀고 LLM 답이 4초 안에 오면 항목별로 덮어쓴다. 안 오면 낱말 해석을 success=true, error_code=LLM_PENDING(실패했으면 LLM_FAILED)으로 돌려주고, 같은 명령문으로 다시 물으면 뒤에서 받은 LLM 답을 준다.", "LLM 키는 로봇의 ~/team/secrets.json(저장소에 없음), 모델·주소는 ~/team/llm_worker.json. 키는 기록에 찍지 않는다. 대회 제공 키로 응답 확인(2026-11-18, 2초 안팎). 실제 경기 명령문으로는 미검증.", "2026-11-18: 공식 문체의 명령문(시설을 기능으로 돌려 말함 — 포털의 팀 테스트 기본 명령문)에 낱말 규칙과 LLM 지시문을 맞춤."]
    source_files: ["개발/src/llm_worker/llm_worker/node.py", "개발/src/llm_worker/llm_worker/interpret.py", "개발/src/llm_worker/llm_worker/parser.py", "개발/src/llm_worker/llm_worker/llm.py"]
