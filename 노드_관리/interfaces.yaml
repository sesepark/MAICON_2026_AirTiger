    category: "지도 · 드론 UGV 자리 구현"
    label: "perception: 본선 카메라에서 경계 찾기가 끝 띠 선 대신 거점 테두리 선을 고르던 것을 고침 (지도 · /team/perception/ugvs 의 오른쪽 1/3 좌표)"
    before: "처음부터 찾기(drone_boundary._search)가 어림 점수 순으로 맞춰 검사를 통과한 첫 조합에서 멈췄다. 본선 카메라는 RED 쪽 끝 띠 선의 20 px 바깥에 거점 테두리 선이 한 줄로 놓여 있어, 그 선을 끝 띠 선으로 고른 조합이 먼저 맞춰지고 단순 렌즈로 검사를 통과했다 (2026-11-19 공식 테스트 경기 여섯 판의 사진 819장 중 402장, 경기 첫 사진 24장 중 16장). 그 경계로 만든 지도 · UGV 자리는 경기장 오른쪽 1/3 이 틀렸다 (UGV 0.2 ~ 0.3 m, 상자 5 ~ 12 cm)."
    after: "토픽 · 타입 · 좌표계는 그대로. 끝 띠 선 곁(45 px)에 훨씬 긴 세로선이 있으면 그 선으로 바꾼 조합을 먼저 맞추고, 확장 렌즈 모델이 깨진 결과에서는 멈추지 않고 끝 띠 선을 달리 고른 조합을 더 맞춰 본다 (낮춘 봉우리 문턱 포함, 한 화면 8번까지). 지난 경계로 맞춘 것이 확장 렌즈를 못 맞추면 처음부터 찾아 본다. 같은 819장: 거점 테두리 선으로 통과한 것 402 → 8장, 경기 첫 사진 24장은 모두 맞는 선 · 상자 16개, 걸린 시간은 그대로. 기록에 map.jsonl 의 boundary_lines · boundary_lens · boundary_tried, ugvs.jsonl view 줄의 lens · strip · rms_m 을 더했다. BoundaryParams.prefer_full_lens=False 면 전과 같다."
    reason: "사용자 지시(2026-11-20: 드론 UGV 자리가 본선 카메라에서도 강건한지 조사 → 오른쪽 1/3 좌표 오차를 우리가 고치기로). 연습 카메라는 코드에 실린 경계로 맞추는 길이라 바뀌지 않는다 (시험 그림 4장의 결과가 전과 같다). 로봇에서는 돌려 보지 않았다 — 본선 카메라 사진은 11-19 의 여섯 판뿐이다."
