  - id: "navigation-goal-shift-align-speed-20261120"
    date: "2026-11-20T02:55:00+09:00"
    category: "주행 노드 구현 · 결과의 뜻"
    label: "navigation: 서 있는 물체가 덮은 목표를 곁의 빈 칸으로 옮김 · 도착 방향 맞추기가 서 있는 물체에 막히면 비켜 서서 돎 · 도착 뒤 되풀이 막기 · 속도 올림"
    before: "서 있는 UGV 가 목표 칸을 덮으면 「그 물체를 지나는 길」 로만 가서 그 앞에 서거나(BLOCKED) 바짝 스쳐 지났다 (01:50 판: 거점 돌진 BLOCKED 4번 · 36 s, 02:39 판: 그 UGV 가운데에서 0.23 m). 도착 방향 맞추기가 지도에 없는 물체에 막히면 5 s 를 기다린 뒤 REACHED [NO_ROOM_AT_GOAL]. 자리에 선 뒤 허용을 0.05 m 넘게 벗어나면 돌아서 다시 다가가기를 시한까지 되풀이할 수 있었다 (01:50 판 25번: 18.2 s). max_v 0.45 · corridor_fast_v 0.30 · rotate_max_w 2.2 · rotate_kick_w 2.8."
    after: "액션 · 타입 · 결과 코드는 그대로이고 REACHED 로 끝나는 경우가 는다. (1) goal_shift_m 0.35: 덮은 것이 서 있는 물체면 목표에서 0.35 m(돌진 0.25 m) 안의 가장 가까운 빈 칸으로 보통 길을 짜서 간다 — detail 「서 있는 물체가 목표 자리를 덮어 … m 옆 (x, y) 로 옮겨 감」, 원래 목표에서 허용 밖이면 [POS_NOT_MET]. 빈 칸이 없으면 전과 같다. (2) align_room_moves 1: 도착 방향으로 돌려니 서 있는 물체에 걸리면 한 번 비켜 서서 돌고 그 자리에서 끝낸다 (못 비키면 1 ~ 2 s 뒤 REACHED [NO_ROOM_AT_GOAL]). (3) arrive_slack_m 0.08 · reapproach_slack_m 0.10 · approach_lag_s 0.5: 허용을 조금 넘어 섰거나 목표 곁을 지나쳤을 때 한 번만 다시 다가가고 그 뒤에는 허용 + 0.10 m 안에서 REACHED [POS_NOT_MET]. (4) max_v 0.55 (목표 0.5 m 앞부터는 approach_v 0.45) · corridor_fast_v 0.35 · rotate_max_w 2.6 · rotate_kick_w 3.0. 모두 params 의 값으로 끄거나 되돌릴 수 있다."
    reason: "사용자 지시(2026-11-20, 남은 목록의 1 · 2 · 3 · 4a · 4b). 근거는 실차 여섯 판(00:00 ~ 02:39)의 기록 — navigation README 「서 있는 UGV 곁의 목표 · 도착 뒤 되풀이 · 속도」. supervisor 가 볼 것: 돌진 목표가 최대 0.25 m 옮겨질 수 있다 (거점의 끝 쪽일 수 있음 — 들어갔는지는 final_pose 로). 실차 흉내 벤치(상자 면 곁 160자리, 이 바꿈을 모두 끈 것과 견줌): 시간 1312 → 1269 s, 도착 160 → 160. 로봇에서는 아직 돌려 보지 않았다."
