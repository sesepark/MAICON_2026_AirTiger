    description: "사진 한 장에 찍힌 수광센서들의 자리와 그것이 어디에 붙은 것인지(지정표적 · UGV)를 알려 준다 — supervisor 가 상대 UGV 를 따라가며 쏠 때 쓴다 (선택 기능)"
    status: "구현 중"
    scope: "team"
    definition_files: ["개발/src/team_interfaces/srv/LocateSensors.srv", "개발/src/team_interfaces/msg/SensorSpot.msg"]
    field_semantics: ["image: supervisor 가 /image_raw 에서 받은 사진 그대로.", "sensors: 사진에 보이는 수광센서마다 하나, 왼쪽부터. 없으면 빈 목록 + ok=true.", "owner: target(상자 면 · 지정표적의 센서) / ugv(사진 속 UGV 박스 안의 센서) / unknown.", "host_kind: 센서가 붙은 그림의 kind(comms · outpost · radar …) 또는 ugv. camp · callsign 은 host 가 UGV 일 때 안테나에서 읽은 값(못 읽으면 빈 문자열).", "좌표 · 크기는 사진 크기에 대한 비율(0 ~ 1)."]
    notes: ["사용자 승인(2026-11-19, 사격 담당). 상대 UGV 를 따라가며 쏘는 선택 기능(mission.engage_ugvs, 기본 끔)이 쓴다. 팬틸트 · 발사는 supervisor 가 한다.", "지정표적(M2) 조준은 이 서비스가 아니라 classify_image 답의 detail 에 실린 수광부 목록을 쓴다.", "실제 사진 · 로봇에서는 미검증 (합성 탐지로 한 단위 시험만)."]
    source_files: ["개발/src/perception/perception/node.py", "개발/src/perception/perception/sensors.py"]
    success_criteria: "ok=true 와 센서 목록"
    failure_criteria: "ok=false 와 detail. 3초 안에 답이 없으면 supervisor 는 못 찾은 것으로 친다."
