  - id: "perception-ugvs"
    name: "/team/perception/ugvs"
    type: "geometry_msgs/msg/PoseArray"
    description: "경기 중 드론 사진에서 찾은 UGV 들의 경기장 자리 (우리 차 포함) — navigation 이 막힘 판단 · 기억 정리 · 지도 고치기에 쓰고, supervisor 가 정찰 순서(서 있는 로봇 곁의 자리를 뒤로 돌림)에 쓴다"
    status: "구현 중"
    scope: "team"
    definition_files: []
    field_semantics: ["poses[i].position.x · y = UGV 가운데 (m), position.z = 점수 (0 ~ 1). orientation 은 w = 1 (방향은 모른다).", "우리 차도 들어 있다 (모델은 진영 · 호출부호를 가리지 못한다) — 받는 쪽이 자기 위치로 골라낸다.", "목록이 비면 그 사진에 UGV 가 없었다는 뜻 (「봤는데 없다」). 토픽이 안 오면 「모른다」."]
    notes: ["perception/ugv_watch.py (2026-11-19): 지도(field_map)가 나온 뒤부터, 드론 사진(/team/server/uav_image, 약 1 Hz)마다 한 번 낸다. 지도를 만든 사진의 경계 · 카메라 높이 · 지도 크기를 그대로 써서 지도와 같은 좌표다. 벽만 있는 임시 지도뿐이면 내지 않는다.", "모델: training/drone_boxes 의 ugv_v1 (YOLO OBB, 클래스 ugv). 로봇의 /home/ws/team/models/drone_ugvs.engine → 같은 이름의 .pt → git 에 넣은 drone_ugv_v1.pt 순. 못 읽으면 내지 않는다 (node_status detail 에 남는다). 파라미터 ugv_watch(기본 true) · ugv_watch_conf(0.5) · ugv_watch_height(0.10 m, UGV 높이 보정 — 공식 테스트 경기 사진으로 맞춘 값) · ugv_watch_min_s(0.5) · ugv_watch_device.", "늦다: header.stamp 는 server_bridge 가 그 사진을 받은 시각이고 사진은 그보다 0.3 ~ 0.7 s 앞서 찍혔다 (2026-11-19 22:39 실차). 판독 시간이 더 붙는다.", "화면 위아래가 잘려 벽 쪽은 안 나온다. UGV 높이에서 보이는 세로 범위(4.80 지도): 본선 카메라 0.44 ~ 4.03 m, 연습 test1 0.23 ~ 4.43 · test2 0.33 ~ 4.46 (2026-11-19 계산). 그 밖의 UGV 는 「없다」 가 아니라 「안 보인다」.", "사진 간격은 우리 진영 시설물이 파괴될수록 1 → 2 → 5 s 로 늘고 3개면 끊긴다 (공식 규정) → 이 토픽도 그만큼 뜸해지거나 끊긴다. navigation 은 간격에 맞춰 잊는 시간을 늘리고, 끊기면 쓰지 않는다.", "navigation 은 정지 · 감속에 쓰지 않는다 (지금 라이다 스캔만). 실제 모델은 PC 에서만 돌려 봤다 (공식 테스트 경기 6판의 사진 819장). 로봇에서는 아직 돌려 보지 않았다 (판독 시간 · 메모리 미확인)."]
    source_files: ["개발/src/perception/perception/ugv_watch.py", "개발/src/perception/perception/drone_ugvs.py", "개발/src/navigation/navigation/driving_node.py", "개발/src/navigation/navigation/drive/ugvs.py", "개발/src/navigation/navigation/slam_node.py", "개발/src/supervisor/supervisor/node.py", "개발/src/supervisor/supervisor/standing.py"]
    units: "m"
    frame: "header.frame_id = arena. x는 BLUE → RED, y는 아래 → 위."
    stamp_field: "header.stamp"
    clock: "ROS time"
    special_values: []
