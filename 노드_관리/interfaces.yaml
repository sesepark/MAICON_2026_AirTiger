  - id: "classify"
    name: "/team/perception/classify_image"
    type: "team_interfaces/srv/ClassifyImage"
    description: "사진 한 장에 찍힌 그림들을 왼쪽부터 알려 준다"
    status: "구현 중"
    scope: "team"
    definition_files: ["개발/src/team_interfaces/srv/ClassifyImage.srv", "개발/src/team_interfaces/msg/Picture.msg"]
    field_semantics: ["image: supervisor 가 /image_raw 에서 받은 사진 그대로 (실측 640x480, rgb8).", "pictures: 그림 하나에 항목 하나, x_center 가 작은 것부터. 그림이 없으면 빈 목록 + ok=true.", "kind: Picture.msg 의 11가지 중 하나. 못 알아본 그림은 빼지 않고 unknown.", "x_center/y_center/width/height: 사진 크기에 대한 비율(0~1).", "detail: ok=true 일 때 '<그림 수> pictures in <ms> ms | sensors=[[x_center, y_center, width, height, confidence], ...]' — 끝의 sensors 는 지정표적 수광부(target_sensor) 탐지이고 사진 크기에 대한 비율, 왼쪽부터, 없으면 sensors=[] (2026-11-19 추가, 메시지 정의는 그대로). ok=false 일 때는 실패한 까닭."]
    notes: ["supervisor 요청(2026-11-18, 요청사항.md 2절). perception 은 사진만 보고 답한다. 어느 상자 면인지는 supervisor 가 로봇 위치와 상자 지도로 정한다."]
    source_files: ["개발/src/perception/perception/node.py"]
    success_criteria: "ok=true 와 그림 목록"
    failure_criteria: "ok=false 와 detail. 5초 안에 답이 없으면 supervisor 는 그 사진을 버린다."
  - id: "read-ugvs"
    name: "/team/perception/read_ugvs"
    type: "team_interfaces/srv/ReadUgvs"
    description: "사진 한 장에 찍힌 UGV 들의 지금 상태(진영 · 호출부호 · 남은 목숨 · 남은 탄)를 알려 준다"
    status: "구현 중"
    scope: "team"
    definition_files: ["개발/src/team_interfaces/srv/ReadUgvs.srv", "개발/src/team_interfaces/msg/UgvState.msg"]
    field_semantics: ["image: supervisor 가 /image_raw 에서 받은 사진 그대로.", "ugvs: 사진에 보이는 UGV 마다 하나 (아군 포함, camp 로 구분). 없으면 빈 목록 + ok=true.", "못 읽은 값은 지어내지 않는다: camp/callsign 은 빈 문자열, lives/ammo 는 -1."]
    notes: ["팀 합의(2026-11-18): M6 재료도 사진을 주면 답하는 방식으로. supervisor 는 UGV 마다 가장 최근 값을 모아 보고 단계에 순위를 낸다.", "위험도 = 남은 목숨/4 + 남은 탄/8 + M3 점수/30. 상대의 M3 점수는 볼 방법이 없어 supervisor 는 세 팀이 같다고 두고 목숨과 탄으로 순위를 정한다."]
    source_files: ["개발/src/perception/perception/node.py"]
    success_criteria: "ok=true 와 UGV 목록"
    failure_criteria: "ok=false 와 detail. 5초 안에 답이 없으면 supervisor 는 그 사진을 버린다."
  - id: "locate-sensors"
