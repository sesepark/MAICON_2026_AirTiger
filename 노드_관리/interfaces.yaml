    field_semantics: ["goal.header.frame_id = \"arena\". goal.pose.orientation = 도착해서 바라볼 방향.", "mode: MODE_NORMAL(0) 경로 계획 후 감속 정지 / MODE_STRAIGHT(1) 회전 없이 시작 방향으로만 앞뒤 직진(M5 다가서기) / MODE_ASSAULT(2) 감속 없이 0.6 m/s, 제동 곡선으로만 정지(M5 진입, 벽 가까운 목표 허용).", "ignore_yaw=true 이거나 yaw_tolerance_rad ≥ π(supervisor는 3.15)이면 도착 방향을 맞추지 않는다.", "feedback.blocked = 목표에 3 s 동안 5 cm 넘게 가까워지지 못함. 주행 노드는 계속 시도하되, 지도에 없는 물체를 지나야만 갈 수 있는 목표(임시 장애물을 넣으면 길이 없음)에서 obstacle_give_up_s(8 s) 동안 못 나아가면 제한 시간 전에 BLOCKED로 끝낸다(2026-11-19).", "result.outcome LOCALIZATION_LOST(7) = 자기 위치가 0.6 s 넘게 끊긴 채 2 s 더 기다려도 오지 않음."]
    notes: ["2026-11-18 사용자 결정: mode·ignore_yaw·LOCALIZATION_LOST·feedback blocked 추가, 실행 중 새 목표는 교체 허용, 우리 거점 진입 금지는 supervisor 책임.", "supervisor 요청서(main, 개발/src/supervisor/docs/요청사항.md) 1절 (가)안과 맞춤: 교체된 목표는 CANCELED, 방향 무시는 yaw_tolerance_rad 3.15, REACHED는 멈춘 뒤."]
    source_files: ["개발/src/navigation/navigation/driving_node.py", "개발/src/navigation/navigation/drive/executor.py", "개발/src/navigation/navigation/drive/grid.py", "개발/src/navigation/navigation/drive/pose_tracker.py", "개발/src/navigation/navigation/drive/obstacles.py", "개발/src/navigation/navigation/drive/fieldmap.py", "개발/src/navigation/navigation/drive/geometry.py", "개발/src/navigation/navigation/drive/params.py"]
    units: "m, rad, ms"
    frame: "goal.header.frame_id = \"arena\" 필수 (x BLUE → RED, y 아래 → 위, m). 다르면 INVALID_GOAL."
    goal_semantics: ["비어 있지 않은 run_id(현재 MissionState.run_id와 같아야 함)·arena 좌표계·경기장 안 좌표·양수 허용 오차·양수 execution_timeout_ms가 필요하다.", "목표 칸이 부풀린 벽·박스 안이면 0.30 m 안의 가장 가까운 빈 칸으로 옮기고 detail에 적는다 (MODE_ASSAULT는 옮기지 않고 가장 가까운 빈 칸까지 경로 후 곧게).", "박스 안 목표·지도 없음·MODE_STRAIGHT에서 차체 방향과 10° 넘게 다른 목표·방향이 필요한데 orientation이 비어 있음은 INVALID_GOAL."]
    feedback_semantics: ["2 Hz. current_pose는 arena 좌표·지금 시각. distance_valid=false이면 remaining_distance_m을 쓰지 않는다.", "phase: driving·rotating·straight·assault·waiting_obstacle·backing_up·moving_off·retracing·no_path·settling·aligning·holding_localization·waiting_control (+degraded_localization). moving_off = 돌 자리를 만들려고 앞으로(곧게 또는 완만한 호) 비키는 중(2026-11-19). retracing = 시한 전 BLOCKED 로 끝내기 전에 지나온 길을 뒤로 되짚어 물러나는 중(2026-11-19 밤).", "blocked=true여도 목표는 계속 실행된다(위의 시한 전 BLOCKED 경우 말고). supervisor가 다른 목표로 바꾸거나 취소할 수 있다. 뒤로 빼는 동안 phase=backing_up."]
    result_semantics: ["REACHED는 위치(·방향) 허용 오차 안에서 멈춘 뒤 0.3 s 기다려 다시 확인한 결과이며 M5 점령 센서 판정과 별개.", "서 있는 물체가 목표 칸을 덮고 있을 때(2026-11-20 새벽): 목표에서 goal_shift_m(0.35 m, 돌진은 0.25 m) 안의 가장 가까운 빈 칸으로 옮겨 간다 — REACHED, detail 「서 있는 물체가 목표 자리를 덮어 … m 옆 (x, y) 로 옮겨 감」, 끝낸 자리가 원래 목표에서 허용 밖이면 [POS_NOT_MET]. 실제 자리는 final_pose (돌진은 거점의 끝 쪽일 수 있다). 그 안에 빈 칸이 없으면 전과 같다.", "허용을 조금 넘어 섰을 때(2026-11-20 새벽): 고치려면 크게 돌아야 하면 허용 + 0.08 m 안에서, 한 번 다시 다가가고도 허용 밖이면 허용 + 0.10 m 안에서 REACHED [POS_NOT_MET] 로 끝낸다. 도착 방향으로 돌려니 서 있는 물체에 걸리면 한 번 비켜 서서 돌고 그 자리에서 끝낸다 (detail 「… 비켜 섬」, 허용 밖이면 [POS_NOT_MET]) — 못 비키면 1 ~ 2 s 뒤 REACHED [NO_ROOM_AT_GOAL].", "서 있는 물체가 목표 곁을 막았을 때(2026-11-20): 막은 것이 서 있는 물체(드론으로 서 있는 UGV · 라이다로 2 s 넘게 한자리)이고 목표까지 near_goal_accept_m(0.35 m) 안이면 BLOCKED 대신 REACHED — detail 「서 있는 물체가 목표 곁을 막아 … m 앞에서 도착으로 끝냄 … [POS_NOT_MET]」, 실제 자리는 final_pose. 보통 목표(NORMAL)만, 돌진은 전과 같다.", "제한 시간이 지났을 때 막혀 있으면 BLOCKED, 아니면 TIMED_OUT. 지도에 없는 물체를 지나야만 갈 수 있는 목표에서 obstacle_give_up_s(5 s) 못 나아가면 시한 전에 BLOCKED(detail 「지도에 없는 물체가 길을 막음 …」, 2026-11-19). 시한이 됐을 때 위치 허용 안에서 방향을 맞추던 중이면 REACHED(YAW_NOT_MET).", "제어 허용 끊김 CONTROL_LOST, 자기 위치 끊김 LOCALIZATION_LOST, 취소·교체 CANCELED(detail로 구분).", "돌 자리 없음(2026-11-19): 서서 돌 자리가 없으면(벽·상자·고정 기둥에 차체 모서리가 걸림, 또는 서서 돌라고 rot_stuck_s 2.5 s 냈는데 방향이 안 바뀜) 끝낸다. 자리에는 왔는데 도착 방향으로 못 돌면 비키지 않고 바로 REACHED + detail 에 「돌 자리 없음(도착 방향)」, 목표 쪽으로 출발할 수 없으면 앞뒤 곧게·완만한 호로 no_room_moves(3)번까지 비켜 본 뒤 BLOCKED + detail 에 「돌 자리 없음(출발)」. detail 은 목표를 옮겼으면 「목표를 … 로 옮김; 」 뒤에 붙으므로 그 말이 들어 있는지로 본다. 이때의 실제 방향은 final_pose.", "REACHED 인데 방향이 허용 밖일 수 있다(detail 로 구분): 회전 3번 뒤 20° 안(「방향이 허용 … 밖 … 에서 끝냄」, 6fa5606) · 도착 방향 맞추기가 align_max_s(15 s) 넘음(「방향 맞추기 … 넘게 허용 … 안에 못 듦」) · 위의 「돌 자리 없음(도착 방향)」. 셋 다 위치는 허용 안이다 — 미션을 이어 가게 도착으로 끝낸다(2026-11-19 사용자 결정).", "결과 코드(2026-11-19): detail 끝에 「 [코드]」 가 붙는다(여럿이면 「 [A] [B]」, 없으면 안 붙음). 한글 문장은 사람이 읽는 것이고 바뀔 수 있으니 받는 쪽은 \"[YAW_NOT_MET]\" in detail 처럼 코드가 들어 있는지로 가른다. REACHED 와 함께: YAW_NOT_MET(끝낸 방향이 요청한 yaw_tolerance_rad 밖 — 실제 방향은 final_pose) · POS_NOT_MET(끝낸 위치가 position_tolerance_m 밖 — 돌진으로 벽 옆에 선 경우) · NO_ROOM_AT_GOAL(자리에서 도착 방향으로 서서 돌 수 없음). 앞의 둘은 어느 길로 끝났든 끝낸 자세로 계산해 붙인다(MODE_STRAIGHT 제외). BLOCKED 와 함께: OBSTACLE(지도에 없는 물체 때문에 나아갈 방법이 없음 — 나중에는 열릴 수 있다) · NO_PROGRESS(가는 중 no_progress_give_up_s 동안 가까워지지 못함) · NO_ROOM_TO_LEAVE(목표 쪽으로 서서 돌 수 없음) · BLOCKED_AT_TIMEOUT(시한 때 막혀 있었음) · INTERNAL_ERROR. 도착 방향을 지도에 없는 물체가 막아 REACHED 로 끝낼 때는 NO_ROOM_AT_GOAL(2026-11-19 통합 전에는 OBSTACLE). 코드 정의: navigation/drive/executor.py CODE_*."]
    cancel_policy: "취소 요청을 받는 즉시 목표를 끝내고 다음 제어 주기(≤ 50 ms)에 속도 0 → CANCELED. 제어 만료 시 정지 후 CONTROL_LOST. pause/resume 뒤 자동 재개 금지."
    preemption_policy: "실행 중 새 목표가 오면 새 목표를 검사해 받을 수 있을 때 이전 목표를 CANCELED(detail \"새 목표로 교체됨\", 액션 상태는 ABORTED)로 끝내고 멈추지 않고 새 목표를 바로 실행. 새 목표가 INVALID_GOAL이면 이전 목표는 그대로 계속."
    success_criteria: "위치 허용 오차(방향을 쓰면 방향 허용 오차까지) 안에서 정지"
    failure_criteria: "막힘·마감·제어 소실·잘못된 목표는 명시적 종료 코드"
