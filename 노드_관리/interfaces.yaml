nodes:
  - id: "supervisor"
    name: "/supervisor"
    label: "미션 전체 컨트롤 타워"
    package: "supervisor"
    owner: "담당자 미지정"
    status: "구현 중"
    description: "미션 진행·우선순위·작업 지시·취소·발사 판단·보고 시점을 관리한다."
    notes: ["/mil/fire 호출은 이 노드만 담당한다. 발사 응답과 유효타격 판정을 구분한다.", "다른 노드의 알고리즘을 직접 실행하거나 내부 모듈을 import하지 않고 ROS 계약으로 지시한다.", "report 단계에는 물리 동작을 금지하되 M6 분석·보고는 유지한다.", "2026-11-18 팀장 결정: 지정표적 조준과 정찰 중 카메라 정면 고정을 위해 /mil/gimbal 을 직접 부른다 (perception 은 TrackTarget 실행 중에만).", "상자 면 기록과 구역별 집계(M3)를 맡는다: /team/navigation/pose · /team/navigation/map 과 /team/perception/classify_image 의 답으로.", "2026-11-18: supervisor_node 를 가짜 상대(임시_테스트_파일/supervisor_가짜상대)와 5분 경기로 돌려 봄. 실제 로봇 · 실제 navigation · perception 으로는 미검증.", "2026-11-18: llm_worker의 답이 LLM_PENDING·LLM_FAILED면 9초마다 다시 묻고(최대 12번), 답이 바뀌면 M1을 다시 보낸다. 명령문을 받고 12초 동안 답이 없으면 같은 작업공간의 llm_worker 낱말 해석기를 직접 부른다(마지막 수단 — 내부 모듈 import 금지의 유일한 예외).", "경기 기록(위치·명령·사진·판독 답·보고)을 기록 폴더의 supervisor/에 남긴다.", "준비완료 조건(2026-11-18): perception은 READY·DEGRADED, navigation·server_bridge는 상태를 내보내고 있기만 하면 됨(navigation은 지도가 오기 전 INITIALIZING이고 지도는 시작 뒤에 온다). node_name은 앞의 '/' 유무를 가리지 않는다. 시작 대기 12초가 지나면 조건이 안 돼도 보낸다 — 안 보내면 그 팀을 빼고 시작할 수 있다(API 문서 1단계).", "단계 정하기(2026-11-18): 경기 모드에서는 /mil/match 만 따른다. 연습 모드에서 로봇의 경기 신호가 없으면 /team/server/state 의 서버 단계를 따른다(ready=시작 대기, running=진행, reporting=보고, finished=종료) — 참가팀 포털의 팀 테스트는 로봇을 잠그지도 시작 신호를 주지도 않는다."]
    source_files: ["개발/src/supervisor/supervisor/node.py", "개발/src/supervisor/supervisor/mission.py", "개발/src/supervisor/supervisor/scout.py", "개발/src/supervisor/supervisor/faces.py"]
  - id: "navigation"
    name: "/navigation"
    label: "주행·경로 계획"
    package: "navigation"
    owner: "담당자 미지정"
    status: "구현 중"
    description: "목표까지 이동하고 경로 계획·장애물 대응·정지를 담당한다."
    notes: ["팀 코드의 /cmd_vel 발행자는 이 노드 하나다. 정지도 이 노드가 속도 0으로 수행한다.", "제어 허용 만료·위치 데이터 단절·취소·예외 시 정지하고, resume만으로 이전 목표를 자동 재개하지 않는다.", "자기 위치는 SLAM(navigation_slam)의 /team/navigation/pose를 쓴다. 사이는 /odom 이동 거리와 /odom/odom_raw 바퀴 거리 차이로 만든 방향 변화로 메운다(기본 yaw_source=wheel, imu 선택 가능. /odom orientation은 상수라 쓰지 않음, 2026-11-18 실측).", "경로: FieldMap 벽·박스를 robot_radius+inflate_margin(0.17 m)만큼 부풀린 5 cm 격자에서 A*. /scan에서 지도에 없는 점과 FieldMap의 OTHER 차량은 임시 장애물. 지도에 없는 점 앞 정지 거리는 stop_dist(0.30 m) + 속도 × stop_reaction_s(0.45 s), 진행 띠(도는 호를 따라 굽힘) 1 m 안부터 감속, 차체 앞 0.12 m 안(서서 돌 때는 모서리가 쓸고 갈 원 안 앞쪽)에 1 s 넘게 있으면 뒤가 빈 경우 뒤로 뺀다(2026-11-19).", "우리 거점 진입 금지는 강제하지 않는다(supervisor 책임, 2026-11-18 사용자 결정).", "서서 돌기와 지도 구조물(2026-11-19, executor._structure_turn_hits · _turn_stuck · _no_room): 차체 반 대각선 0.170 이 격자 부풀림 0.17 과 같아 구조물 곁에서 서서 돌면 모서리가 걸렸다. 돌기 전에 차체 사각형과 벽·박스·고정 기둥 사이의 틈을 정확히 계산해 지도로 보아 겹치는 쪽(structure_turn_clear 0)으로는 돌지 않고(이미 붙어 있으면 멀어지는 쪽은 됨, 지도로 1 cm 넘게 겹쳐 있으면 그 자리 지도를 믿지 않고 검사 안 함), 돌라고 rot_stuck_s(2.5 s) 냈는데 방향이 rot_stuck_rad(3°)도 안 바뀌면 막힌 것으로 본다. 출발하려다 막히면 구조물에서 멀어지는 쪽으로 곧게·완만한 호(반지름 0.5·0.8 m)로 no_room_moves(3)번까지 비켜 본다(자리에 와 있으면 비키지 않고 바로 REACHED). 실차 기록(웹 시험기 bag 2개 · 팀 테스트 3판): 실제로 돈 회전 111번 중 1번만 막았을 것(지도상 상자에 붙은 자리 — 그 자세로 돌려 보면 비켜 돌아 4.5 s 에 도착), 안 도는 회전 감지는 잘못 켜진 곳 0. 가상 30판: 박힌 판 7 → 0.", "도착 방향 맞추기는 align_max_s(15 s)가 지나면 남은 각도와 상관없이 REACHED(detail 에 남은 각도) — 시한까지 돌지 않는다(2026-11-19).", "/cmd_vel 은 16 Hz(control_hz). mil_base_node 가 앞 명령을 보낸 지 50 ms 안의 움직이는 명령을 버리므로 20 Hz 에 딱 맞추지 않는다(2026-11-18).", "debug_hz > 0 이면 /team/navigation/debug 에 경로 · 임시 장애물 · 단계를 낸다(기본 0, 시험 화면용).", "경기 기록(2026-11-19, navigation/run_log.py): 환경변수 TEAM_LOG_DIR(team_node.py 가 정한 이번 실행의 기록 폴더)이 있으면 <기록 폴더>/navigation/debug.jsonl 에 같은 내부 상태를 쓴다 — 목표 실행 중 log_hz(2 Hz), 쉬는 동안 log_idle_s(2 s)마다, 목표 · 결과 · 단계 바뀜 · 위치 상태 바뀜 · 지도는 그때마다. 임시 장애물 칸 목록 대신 칸 수만. 토픽은 내지 않는다. TEAM_LOG_OFF=1 이면 쓰지 않고, 파일 50 MB(TEAM_LOG_LIGHT=1 이면 10 MB)에서 멈춘다. 쓰기는 따로 도는 스레드가 한다(제어 주기는 기다리지 않음).", "지도에 없는 점 판정 허용 거리를 거리 1 m 마다 5 cm 늘린다(map_explain_per_m). 방향이 조금 틀려도 먼 벽이 가짜 장애물이 되지 않게.", "튜닝값은 navigation/drive/params.py의 DriveParams = ROS 파라미터. [추정] 값(min_turn_w·assault_decel·lidar_yaw_deg 등)은 실물로 다시 잰다."]
    source_files: ["개발/src/navigation/navigation/driving_node.py", "개발/src/navigation/navigation/drive/executor.py", "개발/src/navigation/navigation/drive/grid.py", "개발/src/navigation/navigation/drive/pose_tracker.py", "개발/src/navigation/navigation/drive/obstacles.py", "개발/src/navigation/navigation/drive/fieldmap.py", "개발/src/navigation/navigation/drive/geometry.py", "개발/src/navigation/navigation/drive/params.py", "개발/src/navigation/navigation/run_log.py"]
  - id: "navigation-slam"
    name: "/navigation_slam"
    label: "점유 지도 작성"
    package: "navigation"
    owner: "담당자 미지정"
    status: "구현 중"
    description: "항공 FieldMap과 /scan 정합, /odom 이동량, /odom/odom_raw 바퀴 방향(기본, /imu/data 선택 가능)으로 자기차 자세를 갱신한다."
    notes: ["라이다로 드론 지도 상자 고치기(2026-11-18, 2026-11-19 실차 기록으로 고침, navigation/map_fusion.py, 파라미터 map_fusion 기본 true): 정합이 성공한 스캔 2번에 한 번, 상자의 라이다 쪽 면에 점이 맞으면 점수를 올리고(+1) 광선이 상자 속을 10 cm 넘게 지나가면 깎는다(드론 상자 −0.5, 둘 다면 +0.5). −3 이하면 내보내는 지도·정합에서 뺀다(다시 맞으면 되살림). 지도로 설명 안 되는 점에 맞는 40 cm 정사각형이 1 s 넘게 3번 넘게, 한 번이라도 30 cm 넘는 폭으로 보이면 정합에 쓰는 상자로만 더한다(내보내는 지도에는 넣지 않는다). 믿는 구조(외벽 + 라이다로 확인한 상자)에 맞은 점·설명되는 점 비율이 모자라거나 0.6 rad/s 넘게 돌 때는 고치지 않는다. 정합에서 확인 못 한 드론 상자에 맞은 점은 0.7 로 세되 후보 자세의 순위에만 쓰고, 통과 기준(맞은 점 수)은 무게 없이 센다. 드론 지도에 상자가 없어도 외벽만으로 정합한다. PC 에서 한 번 평균 0.4~1.2 ms. false 면 드론 지도를 그대로 쓴다.", "출발 칸 초기화(2026-11-18): 드론 사진(→ 지도)은 running 에서만 오므로 단계로 판단하지 않는다. waiting·ready(잠김) 동안 마지막 /odom x·y·방향을 기억하고, 그 뒤 5 cm·0.1 rad 안이면 첫 지도에서 bases[name=slot] 칸 전체를 라이다로 찾는다(10 cm·7.5° 격자 → 상위 6개 ICP). 항공 차량 검출은 필요 없다. 경기 중에 다시 켜져 잠긴 것을 못 봤으면 항공 SELF 를 기다린다.", "라이다 정합은 numpy 로 계산(2026-11-18). 파이썬 반복문 그대로는 로봇 CPU 에서 스캔 정합 114 ms · 출발 칸 탐색 4.7 s 라 10 Hz 를 못 따라갔다. 바꾼 뒤 PC 7 ms · 0.3 s, 로봇 실차 정합 약 35 ms.", "외벽 밖 15 cm 넘게 나간 라이다 점은 맞은 점 수에서 뺀다(실차: 지도에 상자가 빠졌을 때 벽 밖으로 점이 나가는 틀린 자세가 통과함).", "debug:=true 이면 /team/navigation/debug 에 내부 상태(위치를 못 내는 이유 · 출발 칸 탐색 결과 · 정합 시간)를 2 Hz 로 낸다. 시험 화면용.", "경기 기록(2026-11-19, navigation/run_log.py): TEAM_LOG_DIR 이 있으면 <기록 폴더>/navigation_slam/debug.jsonl 에 같은 내부 상태를 log_hz(2 Hz)로, 받은 지도 · 출발 칸 탐색 결과는 그때마다 쓴다. 토픽은 내지 않는다.", "2026-11-18 UGV-08 모의 경기장(라이다로 만든 지도): 웹 시험기(시험기록/web_drive)로 목표 9개 연속 REACHED. 실제 경기 지도(perception)로는 미검증."]
    source_files: ["개발/src/navigation/navigation/slam_node.py", "개발/src/navigation/navigation/map_fusion.py", "개발/src/navigation/navigation/run_log.py"]
